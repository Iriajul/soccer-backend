# ═══════════════════════════════════════════════════════════════════════════
# Production-style stack: PostgreSQL + the Django/gunicorn app on :3000.
# The app serves at the server root (no /api prefix), exactly like the
# original NestJS backend — point clients' base URL at http://<host>:3000.
#
#   docker compose up -d --build
# ═══════════════════════════════════════════════════════════════════════════

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-soccer}
      POSTGRES_USER:     ${POSTGRES_USER:-soccer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soccer}
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-soccer}"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY:        ${SECRET_KEY}
      DEBUG:             "False"
      ALLOWED_HOSTS:     ${ALLOWED_HOSTS:-*}
      NODE_ENV:          production
      POSTGRES_DB:       ${POSTGRES_DB:-soccer}
      POSTGRES_USER:     ${POSTGRES_USER:-soccer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soccer}
      POSTGRES_HOST:     db
      POSTGRES_PORT:     "5432"
      JWT_ACCESS_SECRET:      ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET:     ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN:  ${JWT_ACCESS_EXPIRES_IN:-30d}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-60d}
      EMAIL_HOST:        ${EMAIL_HOST:-}
      EMAIL_PORT:        ${EMAIL_PORT:-587}
      EMAIL_USER:        ${EMAIL_USER:-}
      EMAIL_PASSWORD:    ${EMAIL_PASSWORD:-}
      SUPER_ADMIN_EMAIL:    ${SUPER_ADMIN_EMAIL:-admin@soccer.com}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-Admin123!}
    ports:
      - "3000:3000"
    volumes:
      - storage_data:/app/storage   # persist uploaded profile images

volumes:
  postgres_data:
  storage_data:
