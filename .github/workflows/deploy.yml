name: Soccer Backend CI/CD

on:
  push:
    branches:
      - main          # push to main → test, then deploy
  pull_request:
    branches:
      - main          # PRs → test only

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1 — Test (every push and PR)
  # ═══════════════════════════════════════════════════════════════
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       soccer
          POSTGRES_USER:     soccer
          POSTGRES_PASSWORD: soccer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY:             test-secret-key-not-real
      DEBUG:                  "True"
      NODE_ENV:               development
      ALLOWED_HOSTS:          localhost,127.0.0.1
      POSTGRES_DB:            soccer
      POSTGRES_USER:          soccer
      POSTGRES_PASSWORD:      soccer
      POSTGRES_HOST:          localhost
      POSTGRES_PORT:          "5432"
      JWT_ACCESS_SECRET:      ci-access-secret-not-real-32bytes-xx
      JWT_REFRESH_SECRET:     ci-refresh-secret-not-real-32bytes-x
      JWT_ACCESS_EXPIRES_IN:  30d
      JWT_REFRESH_EXPIRES_IN: 60d
      DJANGO_SETTINGS_MODULE: config.settings.test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements/test.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements/test.txt

      - name: Run migrations
        working-directory: src
        run: python manage.py migrate --noinput

      - name: Run tests
        working-directory: src
        run: python manage.py test --verbosity=2

  # ═══════════════════════════════════════════════════════════════
  # JOB 2 — Deploy to VPS (only on push to main, after tests pass)
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key:      ${{ secrets.VPS_SSH_KEY }}
          port:     ${{ secrets.VPS_PORT }}
          script: |
            set -e
            echo "━━━━━━ Soccer Backend — Deploying ━━━━━━"

            # 1. Pull latest code
            cd ${{ secrets.VPS_APP_DIR }}
            git pull origin main
            echo "✓ Code pulled"

            # 2. Write .env from GitHub secrets
            cat > .env << 'ENVEOF'
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            DEBUG=False
            NODE_ENV=production
            ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_HOST=db
            POSTGRES_PORT=5432
            JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
            JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
            JWT_ACCESS_EXPIRES_IN=30d
            JWT_REFRESH_EXPIRES_IN=60d
            EMAIL_HOST=${{ secrets.EMAIL_HOST }}
            EMAIL_PORT=${{ secrets.EMAIL_PORT }}
            EMAIL_USER=${{ secrets.EMAIL_USER }}
            EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}
            SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
            SUPER_ADMIN_PASSWORD=${{ secrets.SUPER_ADMIN_PASSWORD }}
            PROXY_NETWORK=${{ secrets.PROXY_NETWORK }}
            ENVEOF
            echo "✓ .env written"

            # 3. Build & (re)start. The entrypoint runs migrate + bootstrap
            #    super admin, then gunicorn on :3000.
            docker compose -f docker-compose.prod.yml up -d --build --force-recreate --remove-orphans
            echo "✓ Containers up"

            # 4. Reload the shared nginx so it re-resolves web's new IP.
            docker exec ${{ secrets.NGINX_CONTAINER }} nginx -s reload || true
            echo "✓ Nginx reloaded"

            docker compose -f docker-compose.prod.yml ps
            echo "━━━━━━ Deploy complete ━━━━━━"
